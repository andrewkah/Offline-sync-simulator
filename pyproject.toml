[project]
name = "offline-sync-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "sqlalchemy>=2.1.1",
]
[tool.fastapi]
entrypoint="src.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
]
